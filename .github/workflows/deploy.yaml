name: Publish Storybook Composition to GitHub Pages

on:
  push:
    branches:
      - 'main' # Replace with the branch you want to deploy from

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache Node.js dependencies
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node20-main-${{ hashFiles('**/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            deps-node20-main-

      # Install dependencies for Design Docs Storybook
      - name: Install dependencies for Design Docs Storybook
        run: |
          cd ./packages/design-docs
          rm -f package-lock.json
          npm ci

      # Install dependencies for React Storybook
      - name: Install dependencies for React Storybook
        run: |
          cd ./packages/react
          rm -f package-lock.json
          npm ci

      # Install dependencies for Angular Storybook
      - name: Install dependencies for Angular Storybook
        run: |
          cd ./packages/angular
          rm -f package-lock.json
          npm ci

      # Install dependencies for root
      - name: Install dependencies for root
        run: |
          rm -f package-lock.json
          npm ci

      # Build React Storybook
      - name: Build React Storybook
        run: |
          cd ./packages/react
          npm run build-storybook

      # Build Angular Storybook
      - name: Build Angular Storybook
        run: |
          cd ./packages/angular
          npm run build-storybook

      # Build Design Docs Storybook (Container Storybook)
      - name: Build Design Docs Storybook
        run: |
          cd ./packages/design-docs
          npm run build-storybook

      # Deploy Storybook Composition to GitHub Pages
      - name: Deploy Storybook Composition to GitHub Pages
        uses: bitovi/github-actions-storybook-to-github-pages@v1.0.3
        with:
          path: ./packages/design-docs/storybook-static # Path to the container Storybook
          checkout: false